name: civicping
description: "CivicPing Pakistan — citizen web app + admin desktop app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase authentication (Google + email/password)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1  # native Google flow on Android/iOS

  # Networking & state
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Device / browser capabilities
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Map (OpenStreetMap — no API key required)
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
